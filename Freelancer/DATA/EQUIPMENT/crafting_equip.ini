;; Lights Material

[Commodity]
nickname = material_red_lights
ids_name = 0
;res str material_red_light01_name
; LIGHTS: Red Lights
ids_info = 0
;res html material_light01_info
; \m\bRed Lights\B
; \l
; This Material can be used to craft Light Packages for ships, you need to know how many Running Lights your desired Ship has and combine your Lights with Optical Chips to craft your desired Package
; \
; Command for Crafting Light Package: /craft <Light Color> Lights for <Shipname> 
; Example: /craft Blue Lights for Defender
; \
; \bRequired Materials\B
; • 1x Lights
; \
; \bService Costs\B
; • Fighters $0
; • Freighters $0
; • CSV $0
; • Repairship $25.000
; • Armored Transport $50.000
; • Transports $75.000
; • Tains $100.000
; • Asteroid Miner $150.000
; • Liner $250.000

units_per_container = 1
pod_appearance = cargopod_blue
loot_appearance = lootcrate_blue
decay_per_second = 0
volume = 0
mass = 0
hit_pts = 1000
lootable = true

